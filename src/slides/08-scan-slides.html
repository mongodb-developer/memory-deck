<section class="slide s-scan" data-title="Scan to access the slides">
  <style>
    .s-scan .wrap{display:grid;grid-template-columns:1fr 440px;gap:60px;align-items:center;height:620px}
    .s-scan h1{font-size:150px;line-height:.9;text-transform:none}
    .s-scan img{width:440px;height:440px;display:block}
    .s-scan .url{font:600 22px var(--mono);color:var(--muted);margin-top:28px}
  </style>
  <div class="wrap">
    <div><h1><span class="build">Scan to access</span><br><span class="build">the slides</span></h1></div>
    <img data-in="0" src="assets/qr-slides.png" alt="QR code to access the slides">
  </div>
  <aside class="notes">Give people a few seconds to scan before moving on.</aside>
  <script type="application/json" class="trace">{
    "0":[["composer","render slide 08 · share link for these slides"],["session","waiting for audience to scan… (take your time)"]]
  }</script>
</section>
